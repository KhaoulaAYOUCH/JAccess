<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">JAccess Mark</title>
  <desc id="desc">Dark blue JAccess governance mark with cyan glow and central J.</desc>
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="52%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.95" />
      <stop offset="0.38" stop-color="#0ea5e9" stop-opacity="0.62" />
      <stop offset="1" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="edge" x1="92" x2="420" y1="92" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071a36" />
      <stop offset="0.5" stop-color="#0b4f9e" />
      <stop offset="1" stop-color="#03142b" />
    </linearGradient>
    <linearGradient id="cyan" x1="118" x2="414" y1="122" y2="324" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38e8ff" />
      <stop offset="0.45" stop-color="#0ea5e9" />
      <stop offset="1" stop-color="#0759c8" />
    </linearGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
