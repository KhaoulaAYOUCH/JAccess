      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" fill="none" />
  <circle cx="256" cy="222" r="205" fill="url(#glow)" opacity="0.75" />

